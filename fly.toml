# fly.toml app configuration file generated for learnx-app on 2026-05-04T20:25:06+01:00
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'learnx-app'
primary_region = 'jnb'

[build]
  dockerfile = 'Dockerfile'

[deploy]
  release_command = 'python manage.py migrate --noinput'

[http_service]
  internal_port = 8000
  force_https = true
  auto_start_machines = true
  min_machines_running = 1
  processes = ['app']

[[vm]]
  memory = '1gb'
  cpus = 1
  memory_mb = 1024
